{% extends 'base.html' %}

{% block content %}
<h4>Please select a cafe:</h4>
<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-2 g-4">
    {% for cafe in cafes %}
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="{{ cafe.img_url }}" class="card-img-top" alt="Image of {{ cafe.name }}" style="height: 200px; object-fit: cover;">
          <div class="card-body">
            <h5 class="card-title">{{ cafe.name }}</h5>
            <p class="card-text">
              📍 {{ cafe.location }}<br>
              ☕ {{ cafe.coffee_price or 'Price N/A' }}
            </p>
            <a href="{{ url_for('cafe_detail', cafe_id=cafe.id) }}" class="btn btn-primary">View Details</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

{% endblock  %}
