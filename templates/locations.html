{% extends 'base.html' %}

{% block content %}
<h4>Please select a cafe:</h4>
<div class="list-group">
    {% for cafe in cafes %}
      <a href="{{ url_for('cafe_detail', cafe_id=cafe.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-1">{{ cafe.name }}</h5>
          <p class="mb-1 text-muted">{{ cafe.location }}</p>
        </div>
      </a>
    {% endfor %}
</div>




{% endblock  %}
