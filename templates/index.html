{% extends 'base.html' %}

{% block title %}WiFinder{% endblock %}

{% block content %}
<header class="bg-primary text-white py-4 shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="display-5 fw-bold mb-0">🛜 WiFinder</h1>
    <form role="search" method="get" action="{{ url_for('search_location') }}">
      <input type="search" placeholder="Search Locations" name="loc" value="{{ request.args.get('loc', '') }}">
      <button class="btn btn-outline-primary" type="submit">Search</button>
    </form>
  </div>
</header>
<div class="container mt-5">
  <h2 class="mb-4">London Cafes</h2>
  <div class="list-group">
    {% for cafe in cafes %}
      <a href="{{ url_for('cafe_detail', cafe_id=cafe.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-1">{{ cafe.name }}</h5>
          <p class="mb-1 text-muted">{{ cafe.location }}</p>
          <small>Has WiFi? {{ cafe.has_wifi }} | Outlets: {{ 'Yes' if cafe.has_sockets else 'No' }}</small>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock  %}
