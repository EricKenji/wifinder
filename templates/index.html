{% extends 'base.html' %}

{% block title %}WiFinder{% endblock %}

{% block content %}
<header class="bg-primary text-white py-4 shadow-sm">
  <div class="container">
    <div class="row align-items-center">
      <!-- Site Title -->
      <div class="col-md-4">
        <h1 class="display-6 fw-bold mb-0">🛜 WiFinder</h1>
      </div>

      <!-- Search Form -->
      <div class="col-md-5 mt-3 mt-md-0">
        <form class="d-flex" role="search" method="get" action="{{ url_for('search_location') }}">
          <input type="search" class="form-control me-2" placeholder="Search Locations" name="loc" value="{{ request.args.get('loc', '') }}">
          <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
      </div>

      <!-- Add Cafe Button -->
      <div class="col-md-3 text-md-end mt-3 mt-md-0">
        <a href="{{ url_for('add_cafe') }}" class="btn btn-light">
          ➕ Add Cafe
        </a>
      </div>
    </div>
  </div>
</header>

<!--Cafe Cards-->
<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-2 g-4">
    {% for cafe in cafes %}
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="{{ cafe.img_url }}" class="card-img-top" alt="Image of {{ cafe.name }}" style="height: 200px; object-fit: cover;">
          <div class="card-body">
            <h5 class="card-title">{{ cafe.name }}</h5>
            <p class="card-text">
              📍 {{ cafe.location }}<br>
              ☕ {{ cafe.coffee_price or 'Price N/A' }}
            </p>
            <a href="{{ url_for('cafe_detail', cafe_id=cafe.id) }}" class="btn btn-primary">View Details</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock  %}
